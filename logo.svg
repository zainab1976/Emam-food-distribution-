<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF8C65" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
  </defs>

  <!-- Leaves -->
  <g transform="translate(65, 105) rotate(-10)">
    <path 
      d="M0 25C0 25 5 5 25 0C35 15 25 35 0 40L0 25Z" 
      fill="#4CAF50" 
    />
    <path 
      d="M20 15C20 15 25 -5 45 -5C55 10 45 30 20 35L20 15Z" 
      fill="#4CAF50" 
      transform="translate(12, -15) rotate(20)"
    />
  </g>

  <!-- The Overlapping EM -->
  <g transform="translate(125, 50)">
    <!-- Letter E (Orange) -->
    <path
      d="M0 0H75L55 25H25V40H50L40 55H25V75H75L65 95H0V0Z"
      fill="url(#orangeGrad)"
    />
    
    <!-- Letter M (Green) - Positioned to overlap the E -->
    <path
      d="M45 10L75 10L105 65L135 10L165 10V105H140V45L115 95H95L70 45V105H45V10Z"
      fill="url(#greenGrad)"
      style="mix-blend-mode: multiply; opacity: 0.95"
    />
  </g>

  <!-- The Smile Arrow -->
  <path
    d="M110 165C160 205 280 205 340 145L348 155C360 140 365 125 350 115C335 125 320 130 305 135L312 145C260 185 160 185 110 165Z"
    fill="url(#orangeGrad)"
  />

  <!-- Text: LANZA -->
  <text
    x="200"
    y="255"
    text-anchor="middle"
    style="fill: #424242; font-size: 64px; font-weight: bold; font-family: sans-serif; letter-spacing: 8px"
  >
    LANZA
  </text>

  <!-- Text: FOOD DISTRIBUTION -->
  <text
    x="200"
    y="290"
    text-anchor="middle"
    style="fill: #757575; font-size: 18px; font-weight: bold; font-family: sans-serif; letter-spacing: 4px"
  >
    FOOD DISTRIBUTION
  </text>
</svg>
