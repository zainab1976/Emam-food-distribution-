<svg width="350" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100">
  <defs>
    <linearGradient id="emamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F28C28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d67a1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F28C28;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Arc - Dynamic gradient arc encircling the truck -->
  <path d="M 15 55 Q 50 15, 85 55" stroke="url(#arcGradient)" stroke-width="9" fill="none" stroke-linecap="round"/>
  
  <!-- Star Badge on green section of arc -->
  <circle cx="95" cy="20" r="13" fill="#4CAF50">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </circle>
  <path d="M 95 12 L 97.5 19 L 105 19 L 98.5 23.5 L 101 31 L 95 26 L 89 31 L 91.5 23.5 L 85 19 L 92.5 19 Z" fill="#FFD700" transform="rotate(15 95 20)">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </path>
  
  <!-- Delivery Truck with animation -->
  <g transform="translate(25, 45)" id="truckGroup">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-100,45; 25,45"
      dur="1.5s"
      begin="0s"
      fill="freeze"/>
    
    <!-- Motion Lines from front -->
    <line x1="0" y1="20" x2="-10" y2="20" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="0.3s" begin="0s" fill="freeze"/>
    </line>
    <line x1="0" y1="25" x2="-10" y2="25" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="0.3s" begin="0.1s" fill="freeze"/>
    </line>
    <line x1="0" y1="30" x2="-10" y2="30" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="0.3s" begin="0.2s" fill="freeze"/>
    </line>
    
    <!-- Truck Body (cargo area) -->
    <rect x="0" y="10" width="40" height="28" fill="#F28C28" rx="3"/>
    
    <!-- Truck Cabin -->
    <rect x="40" y="15" width="22" height="23" fill="#F28C28" rx="3"/>
    
    <!-- Windows -->
    <rect x="43" y="18" width="16" height="14" fill="#333" rx="2"/>
    <line x1="51" y1="18" x2="51" y2="32" stroke="#F28C28" stroke-width="1"/>
    
    <!-- Wheels -->
    <circle cx="10" cy="40" r="7" fill="#fff"/>
    <circle cx="10" cy="40" r="5" fill="#F28C28">
      <animateTransform attributeName="transform" type="rotate" values="0 10 40;360 10 40" dur="0.5s" begin="0s" repeatCount="3" fill="freeze"/>
    </circle>
    <circle cx="30" cy="40" r="7" fill="#fff"/>
    <circle cx="30" cy="40" r="5" fill="#F28C28">
      <animateTransform attributeName="transform" type="rotate" values="0 30 40;360 30 40" dur="0.5s" begin="0s" repeatCount="3" fill="freeze"/>
    </circle>
    <circle cx="52" cy="40" r="7" fill="#fff"/>
    <circle cx="52" cy="40" r="5" fill="#F28C28">
      <animateTransform attributeName="transform" type="rotate" values="0 52 40;360 52 40" dur="0.5s" begin="0s" repeatCount="3" fill="freeze"/>
    </circle>
    
    <!-- Food Items in Truck Bed -->
    <!-- Green Vegetables (Lettuce/Broccoli) -->
    <path d="M 8 15 Q 8 10, 12 10 Q 16 10, 16 15 Q 16 20, 12 20 Q 8 20, 8 15" fill="#4CAF50"/>
    <path d="M 14 12 Q 14 8, 18 8 Q 22 8, 22 12" fill="#4CAF50"/>
    <path d="M 20 15 Q 20 10, 24 10 Q 28 10, 28 15 Q 28 20, 24 20 Q 20 20, 20 15" fill="#4CAF50"/>
    
    <!-- Red Apple -->
    <circle cx="30" cy="18" r="5" fill="#E53935"/>
    <ellipse cx="30" cy="15" rx="2" ry="3" fill="#fff" opacity="0.3"/>
    
    <!-- Orange Carrots -->
    <ellipse cx="35" cy="20" rx="2.5" ry="6" fill="#FF9800" transform="rotate(-25 35 20)"/>
    <ellipse cx="38" cy="18" rx="2" ry="5" fill="#FF9800" transform="rotate(15 38 18)"/>
    
    <!-- Golden Bread/Baguettes -->
    <ellipse cx="12" cy="8" rx="6" ry="3" fill="#D4AF37"/>
    <ellipse cx="20" cy="6" rx="5" ry="2.5" fill="#D4AF37"/>
  </g>
  
  <!-- Text: Emam with gradient - appears after truck animation -->
  <text x="115" y="48" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#emamGradient)" opacity="0" id="emamText">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,10; 0,0" dur="0.8s" begin="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="299.5s" fill="freeze"/>
    Emam
  </text>
  
  <!-- Text: FOOD DISTRIBUTIONS - appears after Emam -->
  <text x="115" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#333" letter-spacing="1px" opacity="0" id="distText">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,10; 0,0" dur="0.8s" begin="2.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="299.5s" fill="freeze"/>
    FOOD DISTRIBUTIONS
  </text>
</svg>
