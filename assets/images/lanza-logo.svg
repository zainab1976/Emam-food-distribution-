<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Lanza Food Distribution">
  <defs>
    <linearGradient id="lanzaGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E7A43"/>
      <stop offset="100%" stop-color="#22A85A"/>
    </linearGradient>
    <linearGradient id="lanzaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#F39A1B"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes truckDrive {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, -3px); }
    }

    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes speedLineMove {
      0%, 100% { opacity: 0.25; transform: translateX(0); }
      50% { opacity: 0.85; transform: translateX(-14px); }
    }

    @keyframes foodBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .truck-animated {
      animation: truckDrive 2.4s ease-in-out infinite;
    }

    .wheel-spin {
      animation: wheelSpin 0.9s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .speed-line {
      animation: speedLineMove 1.1s ease-in-out infinite;
    }

    .speed-line-delay {
      animation: speedLineMove 1.1s ease-in-out infinite;
      animation-delay: 0.35s;
    }

    .food-bounce {
      animation: foodBounce 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Truck icon (left zone) -->
  <g class="truck-animated" transform="translate(8, 8) scale(0.68)">
    <path d="M95 220c0-95 77-172 172-172 55 0 104 26 136 67" fill="none" stroke="#F39A1B" stroke-width="42" stroke-linecap="round"/>
    <path d="M403 115c24 30 38 68 38 109 0 95-77 172-172 172-77 0-142-50-165-119" fill="none" stroke="#22A85A" stroke-width="42" stroke-linecap="round"/>
    <circle cx="418" cy="105" r="45" fill="#22A85A"/>
    <path d="M418 78l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" fill="#FFD447"/>

    <g class="food-bounce">
      <path d="M185 170c-10-20 10-45 32-33 12-22 46-18 48 8 26-10 42 18 22 38-38 10-70 8-102-13z" fill="#22A85A"/>
      <circle cx="280" cy="148" r="18" fill="#E74C3C"/>
      <path d="M276 126c10-12 22-10 28-2-10 0-18 4-20 10z" fill="#22A85A"/>
      <path d="M320 132c26 0 46 16 46 36s-20 36-46 36-46-16-46-36 20-36 46-36z" fill="#F5B041"/>
      <path d="M360 140c24 0 42 14 42 32s-18 32-42 32-42-14-42-32 18-32 42-32z" fill="#F8C471"/>
    </g>

    <rect x="125" y="195" rx="22" ry="22" width="220" height="110" fill="#F36F21"/>
    <rect x="320" y="210" rx="20" ry="20" width="90" height="95" fill="#F36F21"/>
    <path d="M346 226h44c8 0 14 6 14 14v30h-72v-44z" fill="#1E2A3A" opacity="0.9"/>
    <rect x="155" y="175" rx="16" ry="16" width="220" height="70" fill="#F28B1C"/>
    <path d="M170 195h190" stroke="#ffffff" stroke-width="8" opacity="0.35"/>
    <path d="M170 215h190" stroke="#ffffff" stroke-width="8" opacity="0.35"/>

    <g class="wheel-spin">
      <circle cx="185" cy="320" r="34" fill="#F36F21"/>
      <circle cx="185" cy="320" r="22" fill="#ffffff"/>
    </g>
    <g class="wheel-spin">
      <circle cx="370" cy="320" r="34" fill="#F36F21"/>
      <circle cx="370" cy="320" r="22" fill="#ffffff"/>
    </g>

    <path class="speed-line" d="M95 270h45" stroke="#F36F21" stroke-width="10" stroke-linecap="round"/>
    <path class="speed-line-delay" d="M80 295h60" stroke="#F36F21" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Brand text (right zone, no overlap) -->
  <g transform="translate(400, 0)">
    <text x="180" y="158" text-anchor="middle" fill="url(#lanzaGreen)" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="5">LANZA</text>
    <text x="180" y="210" text-anchor="middle" fill="url(#lanzaGold)" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3.5">FOOD DISTRIBUTION</text>
  </g>
</svg>
